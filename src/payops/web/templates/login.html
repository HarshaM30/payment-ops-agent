{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Enter the API key once. The server keeps a signed session cookie; the key itself is not stored in it.</p>
  <form method="post" action="/ui/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Your name <span class="muted">(recorded as the approver)</span>
      <input type="text" name="approver" required maxlength="100" autocomplete="name">
    </label>
    <label>API key
      <input type="password" name="api_key" required autocomplete="current-password">
    </label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
