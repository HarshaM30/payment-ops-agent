# Full local stack: Postgres + the API. Values come from .env (see .env.example).
#   docker compose up -d --wait        # both services (make up)
#   docker compose up -d --wait db     # Postgres only, for `make run` on the Mac (make db)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-payops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    image: payops-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Fail at `docker compose up` with a clear message instead of a crash loop.
      API_KEY: ${API_KEY:?API_KEY is not set. Copy .env.example to .env and fill it in}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is not set. Copy .env.example to .env and fill it in}
      APP_ENV: ${APP_ENV:-development}
      # Inside Compose the database host is the service name, not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-payops}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-payops}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      FAKE_LLM_LATENCY_MS: ${FAKE_LLM_LATENCY_MS:-0}  # simulated LLM latency (fake provider)
      OLLAMA_API_BASE: ${OLLAMA_API_BASE_DOCKER:-http://host.docker.internal:11434}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    ports:
      - "${API_PORT:-8000}:8000"
    stop_grace_period: 40s  # longer than uvicorn's 30s graceful-shutdown timeout

volumes:
  pgdata:
