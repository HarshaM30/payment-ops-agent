[project]
name = "payops"
version = "0.1.0"
description = "Payment operations agent: triages overdue invoices, drafts follow-ups, and gates every action behind deterministic policy and human approval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "faker>=30.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N", "C4", "PT"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S311",   # random is fine for synthetic seed data
]

[tool.ruff.lint.isort]
known-first-party = ["payops", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: needs a running Postgres"]
filterwarnings = [
    "error::DeprecationWarning:payops.*",
    # Upstream notice inside fastapi.testclient; not actionable here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["payops"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
