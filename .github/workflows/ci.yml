name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  APP_ENV: test
  LLM_PROVIDER: fake
  UV_PYTHON: "3.12"

jobs:
  lint-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    env:
      # Unit tests never connect; this only satisfies settings validation.
      DATABASE_URL: postgresql+psycopg://payops:payops@localhost:5432/payops
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit

  integration:
    name: Integration tests + coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payops
          POSTGRES_PASSWORD: payops
          POSTGRES_DB: payops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payops"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://payops:payops@localhost:5432/payops
      TEST_DATABASE_URL: postgresql+psycopg://payops:payops@localhost:5432/payops_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Migrate and seed (smoke test of the real commands)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run python -m scripts.seed
      - name: Tests with coverage
        run: |
          uv run pytest --cov=payops --cov-report=term-missing
          uv run coverage report --include='src/payops/tools/*,src/payops/services/*,src/payops/api/*' --fail-under=85
